# Builds the ClipFarm Windows installer on every push to main and on pull requests.
# Download it from the run page (Actions tab -> latest run -> Artifacts -> ClipFarm-installer).
# Pushing a tag like v0.2.0 also publishes it as a GitHub Release (+ latest.json for auto-update).
#
# Auto-update signing (optional, one-time): run `npx tauri signer generate -w clipfarm.key` and add
#   secret   TAURI_SIGNING_PRIVATE_KEY            = contents of clipfarm.key
#   secret   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   = its password
#   variable TAURI_UPDATER_PUBKEY                 = contents of clipfarm.key.pub
# Without them the installer still builds; the app just doesn't offer in-app updates
# (installing a new version over the top still keeps all settings and keys).
name: build-windows
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install engine dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Fetch FFmpeg and caption font
        working-directory: backend
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          Get-ChildItem ffmpeg_tmp -Recurse -Include ffmpeg.exe, ffprobe.exe | Copy-Item -Destination bin\
          Remove-Item ffmpeg.zip, ffmpeg_tmp -Recurse -Force
          Invoke-WebRequest "https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf" -OutFile assets\fonts\Anton-Regular.ttf
          "$PWD\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          .\bin\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Run engine tests (unit, API contract, end-to-end)
        working-directory: backend
        run: python -m pytest -q -rs

      - name: Freeze engine (PyInstaller)
        working-directory: backend
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --noconsole --name clipfarm-engine-x86_64-pc-windows-msvc `
            --add-data "clipfarm/schema.sql;clipfarm" `
            --collect-submodules uvicorn --collect-data cv2 `
            --collect-all faster_whisper --collect-all ctranslate2 `
            --collect-submodules yt_dlp --collect-all keyring --hidden-import win32ctypes.core --collect-submodules clipfarm `
            --collect-submodules cryptography `
            run_engine.py
          New-Item -ItemType Directory -Force ..\app\src-tauri\binaries | Out-Null
          Copy-Item dist\clipfarm-engine-x86_64-pc-windows-msvc.exe ..\app\src-tauri\binaries\

      - name: Smoke-test the frozen engine
        working-directory: backend
        shell: pwsh
        run: |
          $env:CLIPFARM_PORT = "47999"
          $env:CLIPFARM_DATA_DIR = "$env:RUNNER_TEMP\cf-smoke"
          $p = Start-Process -FilePath dist\clipfarm-engine-x86_64-pc-windows-msvc.exe -PassThru
          $failed = $false
          try {
            $up = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 2
              try { if ((Invoke-RestMethod http://127.0.0.1:47999/health).ok) { $up = $true; break } } catch {}
            }
            if (-not $up) { throw "Engine did not start" }
            foreach ($path in "/settings", "/system", "/dashboard", "/projects", "/clips", "/programs", "/games/trending", "/logs",
                              "/health/checks", "/campaigns", "/projections", "/autopilot", "/earnings", "/submissions", "/accounts", "/projects/defaults") {
              $r = Invoke-WebRequest "http://127.0.0.1:47999$path" -SkipHttpErrorCheck
              Write-Host "$path -> $($r.StatusCode)"
              if ($r.StatusCode -ne 200) { Write-Host $r.Content; $failed = $true }
            }
            (Invoke-RestMethod http://127.0.0.1:47999/system).encoders | Format-Table
          } catch { Write-Host $_; $failed = $true }
          finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          if ($failed) {
            Write-Host "---- engine.log ----"
            Get-Content "$env:CLIPFARM_DATA_DIR\engine.log" -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Install UI dependencies and generate icons
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npx tauri icon app-icon.png

      - name: Build installer
        working-directory: app
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY -and $env:UPDATER_PUBKEY) {
            $cfg = @{ bundle = @{ createUpdaterArtifacts = $true }; plugins = @{ updater = @{ pubkey = $env:UPDATER_PUBKEY } } } | ConvertTo-Json -Depth 5 -Compress
            Set-Content -Path updater.conf.json -Value $cfg
            npx tauri build --config updater.conf.json
          } else {
            Write-Host "No updater signing key: building without in-app updates."
            npx tauri build
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install the built installer and self-test it (no Python/FFmpeg on PATH, awkward paths)
        shell: pwsh
        run: |
          $exe = Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $dir = "$env:RUNNER_TEMP\Program Files Eden's Test\ClipFarm"
          $data = "$env:RUNNER_TEMP\User With Space's\ClipFarm"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "/S", "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exited with $($p.ExitCode)" }
          Get-ChildItem -Recurse $dir | Select-Object FullName, Length | Format-Table -AutoSize
          # A clean machine has no Python, Node or FFmpeg on PATH: hide them from the installed engine.
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $env:CLIPFARM_DATA_DIR = $data
          $env:CLIPFARM_RESOURCE_DIR = $dir
          $env:CLIPFARM_KEYRING_SERVICE = "ClipFarmCI"
          $out = "$env:RUNNER_TEMP\self test.json"
          $t = Start-Process -FilePath "$dir\clipfarm-engine.exe" -ArgumentList "--self-test", "`"$out`"" -Wait -PassThru
          Get-Content $out
          if ($t.ExitCode -ne 0) { throw "Installed engine self-test failed" }
          # Uninstall keeping data (default): settings + vault must survive
          if (-not (Test-Path "$data\vault.dat")) { Write-Host "(vault.dat not created by self-test: no keys kept)" }
          $u = Start-Process -FilePath "$dir\uninstall.exe" -ArgumentList "/S" -Wait -PassThru
          if (-not (Test-Path "$data\clipfarm.db")) { throw "Uninstall removed the user's data folder" }
          Write-Host "Uninstall kept $data as expected."

      - name: Make auto-update manifest (latest.json)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $sig = Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe.sig -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sig) { Write-Host "Not signed for updates; skipping latest.json"; exit 0 }
          $exe = $sig.FullName -replace '\.sig$', ''
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $name = Split-Path $exe -Leaf
          $manifest = @{ version = $ver; notes = "See CHANGELOG.md"; pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ");
            platforms = @{ "windows-x86_64" = @{ signature = (Get-Content $sig.FullName -Raw).Trim();
              url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$name" } } }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content app/src-tauri/target/release/bundle/nsis/latest.json

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ClipFarm-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.sig
            app/src-tauri/target/release/bundle/nsis/latest.json

  # Before/after screenshots of Home, the menu, every New Project step and the streamer list.
  # "Before" is v0.2 (commit 0cf1082), "after" is this commit; both use the same demo data (scripts/demo_seed.py).
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install engine, UI tools and a headless browser
        run: |
          python -m pip install -r backend/requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Take screenshots
        env:
          BEFORE_REF: 0cf1082
        run: |
          set -e
          shoot() {   # $1 = before|after, $2 = checkout folder
            data=/tmp/demo-$1
            rm -rf "$data"
            (cd "$2/backend" && CLIPFARM_DATA_DIR=$data python "$GITHUB_WORKSPACE/scripts/demo_seed.py")
            (cd "$2/backend" && CLIPFARM_DATA_DIR=$data CLIPFARM_WORKERS=0 nohup python run_engine.py > /tmp/engine-$1.log 2>&1 &)
            (cd "$2/app" && npm install --no-audit --no-fund --loglevel=error && (nohup npx vite --port 1420 --strictPort > /tmp/vite-$1.log 2>&1 &))
            for i in $(seq 1 90); do
              curl -sf http://127.0.0.1:47821/health > /dev/null && curl -sf http://localhost:1420 > /dev/null && break
              sleep 2
            done
            python scripts/screenshots.py "shots/$1"
            pkill -f run_engine.py || true
            pkill -f vite || true
            sleep 2
          }
          git worktree add /tmp/before "$BEFORE_REF"
          shoot before /tmp/before
          shoot after "$GITHUB_WORKSPACE"
          ls -R shots

      - name: Show logs if something failed
        if: failure()
        run: tail -n 60 /tmp/engine-*.log /tmp/vite-*.log || true

      - name: Publish screenshots to the ci-screenshots branch (easy to view on GitHub)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd shots
          git init -q && git checkout -q -b ci-screenshots
          git add -A && git -c user.name="ClipFarm CI" -c user.email="ci@clipfarm.invalid" commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: ClipFarm-screenshots-before-after
          path: shots/
          retention-days: 90
